name: Companion Module Checks

on:
  push:
  pull_request:

jobs:
  quality:
    name: Quality, tests and package
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Use Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22.20.0
      - name: Enable Corepack
        run: corepack enable
      - name: Install dependencies
        run: yarn install --immutable
      - name: Check formatting
        run: yarn format:check
      - name: Run unit tests
        run: yarn test
      - name: Validate module metadata
        run: yarn companion-module-check
      - name: Build module package
        run: yarn package
      - name: Verify packaged entrypoint
        run: yarn check:package

  check:
    name: Official Bitfocus package check
    if: github.repository == 'bitfocus/companion-module-srdjankotarlic-protimer'
    permissions:
      packages: read
    uses: bitfocus/actions/.github/workflows/module-checks.yaml@main
